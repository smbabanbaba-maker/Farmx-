name: Build Goall26 APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Goall26 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Goall26
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create temporary web directory
        run: |
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Goall26</title>
            </head>
            <body></body>
          </html>
          EOF

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Initialize Capacitor
        run: |
          npx cap init Goall26 com.sylution.farmx --web-dir dist

      - name: Configure Goall26
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.sylution.farmx',
            appName: 'Goall26',
            webDir: 'dist',
            server: {
              url: 'https://farmx-rvrb.vercel.app',
              cleartext: false
            }
          };

          export default config;
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Goall26 APK
        uses: actions/upload-artifact@v4
        with:
          name: Goall26-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
