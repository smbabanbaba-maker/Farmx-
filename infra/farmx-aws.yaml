AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  FarmX marketplace foundation: private media storage, listings database,
  customer identity, and a dedicated payment-secret placeholder.

Parameters:
  ApplicationOrigin:
    Type: String
    Description: The HTTPS origin that serves FarmX, for example https://app.example.com
    AllowedPattern: "^https://.*$"
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["content-type"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins: [!Ref ApplicationOrigin]
            ExposedHeaders: [ETag]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: FarmX
        - Key: Environment
          Value: !Ref Environment

  ListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: FarmX
        - Key: Environment
          Value: !Ref Environment

  ProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: FarmX
        - Key: Environment
          Value: !Ref Environment

  CommunityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: FarmX
        - Key: Environment
          Value: !Ref Environment

  LearnTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: FarmX
        - Key: Environment
          Value: !Ref Environment

  FarmXUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "farmx-${Environment}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      MfaConfiguration: "OFF"
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "FarmX verification code"
        EmailMessage: "Your FarmX verification code is {####}. Use this code to securely verify your account or reset your password. If you did not request this, you can safely ignore this email."
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      UserPoolTags:
        Application: FarmX
        Environment: !Ref Environment

  FarmXUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "farmx-${Environment}-web"
      UserPoolId: !Ref FarmXUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      SupportedIdentityProviders: [COGNITO]

  PaystackSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "farmx/${Environment}/paystack"
      Description: Replace the placeholder value with the Paystack secret key before enabling payments.
      SecretString: '{"PAYSTACK_SECRET_KEY":"REPLACE_ME"}'
      Tags:
        - Key: Application
          Value: FarmX
        - Key: Environment
          Value: !Ref Environment

  FarmXApplicationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "farmx-${Environment}-application-policy"
      Description: Attach to the FarmX server runtime role only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: MediaObjectAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !Sub "${MediaBucket.Arn}/listings/*"
              - !Sub "${MediaBucket.Arn}/products/*"
          - Sid: ListingsDataAccess
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt ListingsTable.Arn
              - !Sub "${ListingsTable.Arn}/index/*"
          - Sid: CommunityDataAccess
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt CommunityTable.Arn
              - !Sub "${CommunityTable.Arn}/index/*"
          - Sid: ProfileDataAccess
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt ProfileTable.Arn
              - !Sub "${ProfileTable.Arn}/index/*"
          - Sid: LearnDataAccess
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt LearnTable.Arn
              - !Sub "${LearnTable.Arn}/index/*"
          - Sid: ProfileMediaObjectAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${MediaBucket.Arn}/profiles/*"
          - Sid: CommunityMediaObjectAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${MediaBucket.Arn}/community/*"
          - Sid: PaymentSecretRead
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref PaystackSecret

  VercelOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://oidc.vercel.com/sayyeed
      ClientIdList:
        - https://vercel.com/sayyeed
      ThumbprintList:
        - AB9D0263244DD0326EB67015705A667E79CFE998
      Tags:
        - Key: Application
          Value: FarmX
        - Key: Environment
          Value: !Ref Environment

  FarmXVercelRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "farmx-${Environment}-vercel-runtime"
      Description: Short-lived Vercel OIDC runtime role for FarmX production server functions.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/oidc.vercel.com/sayyeed"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc.vercel.com/sayyeed:aud: https://vercel.com/sayyeed
                oidc.vercel.com/sayyeed:sub: owner:sayyeed:project:farmx-rvrb:environment:production
      ManagedPolicyArns:
        - !Ref FarmXApplicationPolicy
      Tags:
        - Key: Application
          Value: FarmX
        - Key: Environment
          Value: !Ref Environment

Outputs:
  MediaBucketName:
    Description: Use as FARMX_MEDIA_BUCKET on the FarmX server.
    Value: !Ref MediaBucket
  ListingsTableName:
    Description: Use as FARMX_LISTINGS_TABLE on the FarmX server.
    Value: !Ref ListingsTable
  ProfileTableName:
    Description: Use as FARMX_PROFILE_TABLE on the FarmX server.
    Value: !Ref ProfileTable
  CommunityTableName:
    Description: Use as FARMX_COMMUNITY_TABLE on the FarmX server.
    Value: !Ref CommunityTable
  LearnTableName:
    Description: Use as FARMX_LEARN_TABLE on the FarmX server.
    Value: !Ref LearnTable
  VercelRuntimeRoleArn:
    Description: Use as AWS_ROLE_ARN in the Vercel production environment.
    Value: !GetAtt FarmXVercelRuntimeRole.Arn
  AwsRegion:
    Description: Use as AWS_REGION on the FarmX server.
    Value: !Ref AWS::Region
  CognitoUserPoolId:
    Description: Cognito user pool identifier for the web authentication integration.
    Value: !Ref FarmXUserPool
  CognitoWebClientId:
    Description: Cognito SPA client identifier.
    Value: !Ref FarmXUserPoolClient
  ApplicationPolicyArn:
    Description: Attach this policy to the FarmX server runtime IAM role.
    Value: !Ref FarmXApplicationPolicy
  PaystackSecretArn:
    Description: Secret ARN for the payment backend runtime role.
    Value: !Ref PaystackSecret
